name = "drew-agent"
main = "src/index.js"
compatibility_date = "2026-05-01"

# Optional: pin a specific Worker route once you've mapped a custom domain.
# After running `wrangler deploy`, you can:
#   1. Map api.drewmalhotra.com to this Worker via the Cloudflare dashboard
#      (Workers & Pages → drew-agent → Triggers → Custom Domains).
#   2. Or use the worker's default *.workers.dev URL — just paste it into the
#      frontend's VITE_AGENT_ENDPOINT env var.

[vars]
# Comma-separated origin allowlist. Browsers from other origins are blocked by CORS.
# Production: drewmalhotra.com (custom domain) + d-malhotra2020.github.io (gh-pages mirror)
# Dev: localhost:3000 for `npm run dev`
ALLOWED_ORIGIN = "https://drewmalhotra.com,https://d-malhotra2020.github.io,http://localhost:3000"

# Optional model override. Defaults to @cf/meta/llama-3.3-70b-instruct-fp8-fast.
# Any Workers AI text-generation model id works — see
# https://developers.cloudflare.com/workers-ai/models/
# MODEL = "@cf/meta/llama-3.1-8b-instruct"

# Daily-cost circuit breaker — value in micro-USD (USD * 1_000_000), estimated
# from Workers AI's per-token pricing (see PRICING_MICRO_USD in src/index.js).
# The Worker short-circuits with HTTP 503 once cumulative estimated cost for
# the current UTC day reaches this number. Default: 333000 = $0.333/day.
# Workers AI's own free tier (10,000 neurons/day) covers this site's realistic
# traffic on its own — this breaker is a second, independent safety net.
# See workers/agent/README.md → "Cost guardrails" for the cost math.
DAILY_COST_LIMIT_MICRO_USD = "333000"

# Workers AI binding — no API key/secret needed. Billed to this Cloudflare
# account; see https://developers.cloudflare.com/workers-ai/platform/pricing/
[ai]
binding = "AI"

# Per-IP rate limit backed by KV. Tried the `[[unsafe.bindings]]` ratelimit form
# first; in wrangler 3.x it registered as "Unsafe Metadata" but didn't enforce
# at runtime. KV is bulletproof on any wrangler version. Sliding window: 20
# requests / 60 seconds, key = client IP.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "b22c64c77ec34f57bc161773a3b301c1"

# Workers Analytics Engine — receives per-request telemetry events
# (token counts + estimated cost per conversation, outcome-indexed).
[[analytics_engine_datasets]]
binding = "TELEMETRY"
dataset = "drew_agent_events"
